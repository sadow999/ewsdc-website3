name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Project site served from /<repo>. Blank both of these and set
      # NEXT_PUBLIC_SITE_URL to your domain if you attach a custom domain.
      NEXT_PUBLIC_BASE_PATH: /ewsdc-website3
      NEXT_PUBLIC_SITE_URL: https://sadow999.github.io/ewsdc-website3
      # Optional: add FORM_ENDPOINT as a repository variable to enable the
      # contact form. Settings → Secrets and variables → Actions → Variables.
      NEXT_PUBLIC_FORM_ENDPOINT: ${{ vars.FORM_ENDPOINT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build

      - name: Verify export
        run: test -f out/index.html || { echo "::error::next build produced no out/index.html"; exit 1; }

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
